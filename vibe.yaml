# UNVALIDATED: adapted from the design-doc example, not checked against the platform.
# Per the design doc, the backend may not require this file at intake.
name: task-tracker                    # must be unique

workloads:
  web:
    artifact:
      source:
        repo: github.com/radu-dragon/task-tracker
        ref: main
        path: .
    ports:
      http:
        protocol: http
        expose: public
    size: small
    health:
      path: /health                   # this app serves /health (not /healthz)
    env:
      LOG_LEVEL: info
      # TODO: db connection details are injected as secrets, but the names aren't documented.
      # The app accepts DATABASE_URL or PGHOST/PGPORT/PGUSER/PGPASSWORD/PGDATABASE and logs the
      # names of DB-related env vars at startup. After the first deploy, check the logs, then if
      # needed map explicitly (only `project.` scope is confirmed):
      # DATABASE_URL:
      #   secret: project.<name>
      # Alternative: create a per-app vibe-secret (POST /api/v2/vibe-secrets, key DATABASE_URL);
      # it is injected as an env var by key. Keys starting VIBE_ or HARNESS_ are reserved.
    uses: [db]

  db:
    kind: database
    database:
      engine: postgres
      version: "16"
    size: small

routes:
  site:
    match: /
    to: web.http

environments:
  preview:
    workloads:
      web:
        size: nano
